<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SASE Private Access Policy Sync</title>

<link rel="stylesheet" href="css/styles.css">
</head>

<body>

<div class="container">

<h2>SASE Private Access Unified Policy</h2>

<div style="display: flex; justify-content: space-between; align-items: center;">

    <!-- LEFT SIDE -->
    <div style="display: flex; gap: 10px;">

        <button onclick="validatePolicy()" id="validateBtn">
            Validate Policy
        </button>

        <button id="btn" onclick="openModal()" disabled>
            Install Policy
        </button>

    </div>

    <!-- RIGHT SIDE -->
    <div style="display: flex; gap: 8px; align-items: center;">

        <label>SASE Network:</label>

        <select id="networkSelect"></select>

    </div>

</div>

<div class="panel">
    <div id="output">Validate your policy, then click "Install Policy"</div>
</div>

<div id="confirmModal" class="modal">
    <div class="modal-content">
        <h3>Confirm Policy Installation</h3>

        <div id="networkInfo" style="margin-bottom:10px; font-weight:bold;"></div>

        <p>
            Are you sure you want to push this policy to SASE?<br><br>
            <strong>Warning:</strong> The current SASE policy will be completely overwritten.
        </p>

        <div class="modal-actions">
            <button onclick="confirmInstall()">Confirm</button>
            <button onclick="closeModal()" class="secondary">Cancel</button>
        </div>
    </div>
</div>


</div>

<script>
console.log("utils:", typeof window.format);
</script>


<script src="js/utils.js"></script>
<script src="js/renderer.js"></script>
<script src="js/api.js"></script>

</body>
</html>
